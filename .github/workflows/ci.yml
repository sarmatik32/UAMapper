name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Clean install
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: Build
      run: npm run build

    - name: Run tests (if available)
      run: npm test
      continue-on-error: true

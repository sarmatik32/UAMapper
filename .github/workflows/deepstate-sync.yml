name: DeepState territory sync

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepstate-territory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync DeepState history and GeoJSON
        run: node scripts/deepstate-sync.mjs
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/deepstate
          if git diff --cached --quiet; then
            echo "No DeepState changes to commit"
          else
            git commit -m "chore: sync DeepState territory data"
            git push
          fi
